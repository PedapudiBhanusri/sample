<html>
    <head>
        <title>
           login page  
        </title> 
    </head>
	<h1>REGISTRATION FORM</h1>
    <body style="background-color:pink" text-align="center"/>
        <form >
      NAME:
      <input type="text" id="tbname" name="tbname" placeholder="enter your name"> <br>
      GENDER:
      <input type="radio" id="rdm" name="gen" value="male"> M
      <input type="radio" id="rdf" name="gen" value="female">F
      <input type="radio"  id="rdo" name="gen" value="others">O<br>
      COURSE:
      <input type="checkbox" id="cbj" name="c" value="java">JAVA
      <input type="checkbox" id="cbp" name="c" value="python">PYTHON
      <input type="checkbox" id="cbc#" name="c" value=".net">C# <br>
      STATE:
      <select name="ddlstate" id="ddlstate">
        <option value="">--------select-------</option>
        <option value="KARNATAKA">KA</option>
        <option value="ANDRA">AP</option>
        <option value="TAMIL NADU">TN</option>
      </select> <br>
      GRADUATION:
      <datalist id="dlgra">
        <option value="BE"></option>
        <option value="BA"></option>
        <option value="btech"></option>
      </datalist>
      <input type="text" list="dlgra"> <br>
      AGE: <input type="number" min="1" max="100"> <br>
      EMAIL: <input type="email" id="em" placeholder="enter your mail"> <br>
      PHOTO: <input type="file" id="f" multiple> <br>
      DOB: <input type="date" id="d1"> <br>
      DOJ: <input type="month" id="m1"> <br>
      SELECT COLOR: <input type="color" id="c1"> <br>
      <details id="d1">
        <summary>terms and cond's</summary>
        <p>1.information1</p>
        <p>2.information1</p>
        <p>3.information1</p>
        <p>4.information1</p>
      </details>
      <input type="button" value="LOGIN" ID="btn1"> <br>
      <input type="submit" > <br>
      <input type="reset">

        </form>

    </body>
</html>
